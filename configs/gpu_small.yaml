seed: 42
data_dir: data/vocab_1024
model:
  preset: baseline
  vocab_size: 1024
  block_size: 256
  n_layer: 10
  n_head: 6
  n_embd: 384
  dropout: 0.1
  bias: true
  tie_weights: true
  use_sdpa: false
train:
  token_budget: 50331648
  batch_size: 32
  grad_accum: 2
  lr: 0.0006
  min_lr: 0.00006
  warmup_steps: 120
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 256
  checkpoint_interval: 64
  eval_batch_size: 32
  log_interval: 32
  device: auto
  compile: false
