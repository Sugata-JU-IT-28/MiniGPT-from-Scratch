[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "minigpt-from-scratch"
version = "0.1.0"
description = "A GPT-style language model built by hand in PyTorch"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy", "matplotlib", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["minigpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: longer-running property or integration checks"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
